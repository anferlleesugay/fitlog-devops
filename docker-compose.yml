services:
  proxy:
    build: ./proxy
    image: fitlog/proxy:${TAG:-latest}
    ports:
      - "8085:80"
    depends_on:
      - frontend
      - tracker-api
    networks:
      - frontend-net
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        BUILD_NUMBER: ${TAG:-dev}
    image: fitlog/frontend:${TAG:-latest}
    networks:
      - frontend-net
    restart: unless-stopped

  tracker-api:
    build:
      context: ./tracker-api
      target: production
    image: fitlog/tracker-api:${TAG:-latest}
    environment:
      DB_HOST: db
      DB_NAME: fitlogdb
      DB_USER: fitlog_user
      DB_PASSWORD: fitlogpassword
    depends_on:
      db:
        condition: service_healthy
    networks:
      - frontend-net
      - backend-net
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fitlogdb
      POSTGRES_USER: fitlog_user
      POSTGRES_PASSWORD: fitlogpassword
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitlog_user -d fitlogdb"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend-net
    restart: unless-stopped

volumes:
  pgdata:

networks:
  frontend-net:
  backend-net: